name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,cli,mcp]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

      - name: Validate taxonomy
        run: python -c "from core.schema_validator import validate_taxonomy; r = validate_taxonomy(); assert r.ok, r.errors"

      - name: Generate web app
        run: python web/generate.py

      - name: Set up Node
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web app smoke test
        if: matrix.python-version == '3.12'
        run: |
          npm --prefix web ci
          node web/smoke.test.js

      - name: Build wheel (packaging check)
        run: |
          pip install build
          python -m build --wheel
          pip install twine
          twine check dist/*.whl
